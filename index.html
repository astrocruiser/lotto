<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 조건 필터 생성기</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #14181d; background: #edf1f4; }
    * { box-sizing: border-box; }
    body { max-width: 1120px; margin: 0 auto; padding: 22px 28px 40px; line-height: 1.5; }
    h1 { margin: 0; padding: 0 0 14px; border-bottom: 1px solid #bfc7ce; text-align: center; font-size: clamp(1.5rem, 4vw, 2.2rem); }
    h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .intro { margin: 14px 0 20px; color: #4d5964; }
    .panel { padding: 18px 0; margin: 14px 0; border-top: 1px solid #cbd2d8; }
    .panel-heading { margin-bottom: 14px; font-size: 1.3rem; font-weight: 800; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .toolbar-label { margin-right: 2px; font-weight: 700; }
    input, button { padding: 10px 14px; border: 1px solid #b7c0c8; border-radius: 7px; font: inherit; }
    button { cursor: pointer; background: #31516d; color: white; border: 0; font-weight: 700; }
    button.secondary { background: #68747e; }
    button:focus-visible, input:focus-visible { outline: 3px solid #8cbbe0; outline-offset: 2px; }
    .choice { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-weight: 700; }
    .choice input { width: 18px; height: 18px; margin: 0; accent-color: #31516d; }
    #status { margin: 12px 0 4px; color: #4d5964; white-space: pre-wrap; }
    #latestDraw { margin: 0; font-weight: 700; }
    #results:empty { display: none; }
    .results-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 250px); align-items: center; gap: 20px; margin-top: 16px; }
    .table-wrap { overflow-x: auto; border: 1px solid #aeb8c1; border-radius: 8px; background: #fff; }
    .results-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    .results-table th, .results-table td { padding: 8px 10px; border-right: 1px solid #c4ccd2; border-bottom: 1px solid #c4ccd2; text-align: center; }
    .results-table tr:last-child th, .results-table tr:last-child td { border-bottom: 0; }
    .results-table th:last-child, .results-table td:last-child { border-right: 0; }
    .results-table th { background: #dce3e8; font-weight: 800; }
    .results-table td.numbers { min-width: 280px; }
    .results-table td.overlap { min-width: 190px; font-weight: 700; }
    .ball { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin: 0 2px; border-radius: 50%; background: linear-gradient(145deg, #526d86, #263e56); color: #fff; font-weight: 800; box-shadow: inset 0 1px 1px #ffffff55; }
    .results-note { padding: 12px 0 12px 18px; border-left: 4px solid #526d86; font-size: 1.15rem; font-weight: 750; }
    .summary { margin-top: 16px; }
    .summary p { margin: 4px 0; font-weight: 650; }
    .probability { display: block; margin-top: 18px; color: #56616b; line-height: 1.6; }
    .error { color: #a12727 !important; font-weight: 700; }
    @media (max-width: 740px) {
      body { padding: 16px 14px 30px; }
      .results-layout { grid-template-columns: 1fr; gap: 14px; }
      .results-note { font-size: 1rem; }
      .results-table th, .results-table td { padding: 7px 8px; }
      .ball { width: 30px; height: 30px; margin: 0 1px; }
    }
  </style>
</head>
<body>
  <h1>로또 번호 생성기 - 결과 화면</h1>
  <p class="intro">과거 당첨 조합과 8가지 번호 조건을 적용해 5게임 또는 10게임을 생성합니다. 이 필터와 게임 간 분산은 당첨 확률을 높여주지 않으며, 번호 선택을 돕는 개인용 도구입니다.</p>

  <section class="panel">
    <div class="toolbar">
      <button id="refresh">새 회차 자동 확인</button>
      <button id="clear" class="secondary">저장 데이터 초기화</button>
    </div>
    <p id="status">저장된 회차를 확인하는 중입니다.</p>
    <p id="latestDraw"></p>
  </section>

  <section class="panel">
    <div class="panel-heading">게임 수량 선택</div>
    <div class="toolbar" role="group" aria-label="생성할 게임 수">
      <label class="choice"><input type="radio" name="gameCount" value="5" checked> 5게임</label>
      <label class="choice"><input type="radio" name="gameCount" value="10"> 10게임</label>
      <button id="generate">조건에 맞는 번호 생성하기</button>
    </div>
    <div id="results" aria-live="polite"></div>
    <small class="probability">한 게임의 1등 확률은 1/8,145,060입니다. 서로 다른 5게임 또는 10게임의 확률은 각각 5/8,145,060, 10/8,145,060입니다. 필터와 분산 방식이 같은 게임 수의 당첨 확률을 높이지는 않습니다.</small>
  </section>

  <script>
    const STORAGE_KEY = "lotto-recommender-results-v1";
    const state = loadState();
    const $ = (id) => document.getElementById(id);

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return saved && typeof saved === "object" && saved.draws ? saved : { draws: {} };
      } catch (error) {
        console.error("저장 데이터를 읽지 못했습니다.", error);
        return { draws: {} };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function parseNumbers(value) {
      const numbers = value.split(/[,\s]+/).filter(Boolean).map(Number);
      if (numbers.length !== 6 || numbers.some((n) => !Number.isInteger(n) || n < 1 || n > 45)
        || new Set(numbers).size !== 6) {
        throw new Error("1부터 45 사이의 서로 다른 번호 6개를 입력해 주세요.");
      }
      return numbers.sort((a, b) => a - b);
    }

    function updateStatus(message) {
      const rounds = Object.keys(state.draws).map(Number).sort((a, b) => b - a);
      $("status").classList.remove("error");
      const recentRounds = rounds.slice(0, 10);
      const drawSummary = rounds.length
        ? `${rounds.length}회${recentRounds.length ? ` (최근 ${recentRounds.join(", ")})` : ""}`
        : "없음";
      $("status").textContent = `${message}\n저장된 회차: ${drawSummary}`;
      if (rounds.length) {
        const latest = rounds[0];
        $("latestDraw").textContent = `${latest}회 당첨번호: ${state.draws[latest].join(", ")}`;
      } else {
        $("latestDraw").textContent = "";
      }
    }

    async function updateNewDraws() {
      try {
        const response = await fetch(`lotto-data.json?updated=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("누적 데이터 파일을 불러오지 못했습니다.");
        const published = await response.json();
        Object.assign(state.draws, published.draws || {});
        saveState();
        updateStatus("GitHub Actions가 갱신한 누적 데이터를 불러왔습니다.");
      } catch (error) {
        updateStatus("누적 데이터 확인에 실패했습니다. 브라우저에 저장된 데이터를 사용합니다.");
        console.error(error);
      }
    }

    $("refresh").addEventListener("click", async () => {
      await updateNewDraws();
    });

    $("clear").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      Object.keys(state.draws).forEach((round) => delete state.draws[round]);
      updateStatus("저장 데이터를 초기화했습니다.");
    });

    function randomInt(max) {
      const range = 0x100000000;
      const limit = range - (range % max);
      const buffer = new Uint32Array(1);
      let value;
      do {
        crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= limit);
      return value % max;
    }

    function drawNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      for (let index = 0; index < 6; index += 1) {
        const selected = index + randomInt(pool.length - index);
        [pool[index], pool[selected]] = [pool[selected], pool[index]];
      }
      return pool.slice(0, 6).sort((a, b) => a - b);
    }

    function getWinningKeys() {
      return new Set(Object.values(state.draws).map((numbers) => numbers.slice().sort((a, b) => a - b).join(",")));
    }

    function getRecentMissingNumbers() {
      const rounds = Object.keys(state.draws).map(Number).sort((a, b) => b - a);
      if (rounds.length < 10) {
        throw new Error("최근 10회 당첨번호 데이터가 필요합니다. 데이터를 먼저 갱신해 주세요.");
      }
      return new Set(Array.from({ length: 45 }, (_, index) => index + 1)
        .filter((number) => !rounds.slice(0, 10).some((round) => state.draws[round].includes(number))));
    }

    function isValid(numbers, recentMissing, winningKeys) {
      const key = numbers.join(",");
      const odd = numbers.filter((number) => number % 2).length;
      const sum = numbers.reduce((total, number) => total + number, 0);
      const endings = numbers.reduce((counts, n) => {
        const end = n % 10;
        counts[end] = (counts[end] || 0) + 1;
        return counts;
      }, {});
      const sections = numbers.reduce((counts, n) => {
        const section = n < 10 ? 0 : Math.floor(n / 10);
        counts[section] = (counts[section] || 0) + 1;
        return counts;
      }, {});
      const hasThreeConsecutive = numbers.some((number) =>
        numbers.includes(number + 1) && numbers.includes(number + 2));
      return !winningKeys.has(key)
        && numbers.some((number) => recentMissing.has(number))
        && Object.values(sections).every((count) => count < 4)
        && Object.values(endings).every((count) => count < 3)
        && [2, 3, 4].includes(odd)
        && sum >= 100 && sum <= 170
        && !hasThreeConsecutive
        && numbers.filter((number) => number <= 31).length < 5;
    }

    function getCandidatePool(count, recentMissing, winningKeys) {
      const candidates = [];
      const keys = new Set();
      for (let attempt = 0; attempt < 100000 && candidates.length < 1500; attempt += 1) {
        const numbers = drawNumbers();
        const key = numbers.join(",");
        if (!keys.has(key) && isValid(numbers, recentMissing, winningKeys)) {
          keys.add(key);
          candidates.push(numbers);
        }
      }
      if (candidates.length < count) {
        throw new Error("조건을 만족하는 조합을 충분히 만들지 못했습니다. 다시 시도해 주세요.");
      }
      return candidates;
    }

    function overlapCount(first, second) {
      return first.filter((number) => second.includes(number)).length;
    }

    function chooseDiverseGames(candidates, count) {
      let bestGames = null;
      let bestScore = null;
      for (let trial = 0; trial < 24; trial += 1) {
        const remaining = candidates.slice();
        const games = [remaining.splice(randomInt(remaining.length), 1)[0]];
        while (games.length < count) {
          let bestScoreForCandidate = null;
          let tiedIndices = [];
          remaining.forEach((candidate, index) => {
            const overlaps = games.map((game) => overlapCount(candidate, game));
            const score = [Math.max(...overlaps), overlaps.reduce((sum, value) => sum + value, 0)];
            if (!bestScoreForCandidate || score[0] < bestScoreForCandidate[0]
              || (score[0] === bestScoreForCandidate[0] && score[1] < bestScoreForCandidate[1])) {
              bestScoreForCandidate = score;
              tiedIndices = [index];
            } else if (score[0] === bestScoreForCandidate[0] && score[1] === bestScoreForCandidate[1]) {
              tiedIndices.push(index);
            }
          });
          const selected = tiedIndices[randomInt(tiedIndices.length)];
          games.push(remaining.splice(selected, 1)[0]);
        }
        const overlaps = [];
        for (let first = 0; first < games.length; first += 1) {
          for (let second = first + 1; second < games.length; second += 1) {
            overlaps.push(overlapCount(games[first], games[second]));
          }
        }
        const score = [Math.max(...overlaps), overlaps.reduce((sum, value) => sum + value, 0)];
        if (!bestScore || score[0] < bestScore[0]
          || (score[0] === bestScore[0] && score[1] < bestScore[1])) {
          bestScore = score;
          bestGames = games;
        }
      }
      return { games: bestGames, maxOverlap: bestScore[0] };
    }

    $("generate").addEventListener("click", () => {
      try {
        const count = Number(document.querySelector('input[name="gameCount"]:checked').value);
        if (![5, 10].includes(count)) throw new Error("5게임 또는 10게임을 선택해 주세요.");
        const recentMissing = getRecentMissingNumbers();
        const winningKeys = getWinningKeys();
        const candidates = getCandidatePool(count, recentMissing, winningKeys);
        const selection = chooseDiverseGames(candidates, count);
        const rows = selection.games.map((numbers, index) => {
          const maxOverlap = Math.max(...selection.games
            .filter((_, gameIndex) => gameIndex !== index)
            .map((game) => overlapCount(numbers, game)));
          return `<tr><th scope="row">게임 ${index + 1}</th><td class="numbers">${
            numbers.map((number) => `<span class="ball">${String(number).padStart(2, "0")}</span>`).join("")
          }</td><td class="overlap">다른 게임과 최대 겹침: ${maxOverlap}개</td></tr>`;
        }).join("");
        $("results").innerHTML = `<div class="results-layout">
          <div class="table-wrap"><table class="results-table"><tbody>${rows}</tbody></table></div>
          <aside class="results-note">게임별 다른 조합과의 번호 겹침 수치를 분석하여 최대한 분산된 조합을 우선 배치했습니다.</aside>
        </div>
        <div class="summary"><h2>통계 요약</h2><p>전체 게임 중 최대 번호 겹침: ${selection.maxOverlap}개</p></div>`;
        updateStatus(`${count}게임을 생성했습니다. 필터와 번호 분산은 당첨 확률을 높이지 않습니다.`);
      } catch (error) {
        $("results").textContent = "";
        $("status").classList.add("error");
        updateStatus(`번호 생성 실패: ${error.message}`);
        $("status").classList.add("error");
      }
    });

    updateStatus("누적 데이터를 불러오는 중입니다.");
    updateNewDraws();
  </script>
</body>
</html>
